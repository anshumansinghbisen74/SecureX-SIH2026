services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: securex
      POSTGRES_USER: securex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - securex-postgres:/var/lib/postgresql/data
  blockchain:
    image: node:22
    working_dir: /app
    volumes:
      - ./blockchain:/app
    command: sh -c "npm install --legacy-peer-deps && npx hardhat node"
    ports:
      - "127.0.0.1:8545:8545"
volumes:
  securex-postgres:
